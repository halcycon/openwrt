name: Create GitHub release

# Tag releases for USG-PRO-4 images are created by build-usg-pro-4.yml
# (with firmware + matching .apk assets). Keep this as a manual draft helper only.

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
