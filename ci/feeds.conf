# Feeds for the USG-PRO-4 image workflow (.github/workflows/build-usg-pro-4.yml).
# NOTE: scripts/feeds strips "# " but NOT a lone "#" line — never use bare "#"
# separators or feeds will error with "Syntax error".
# Only packages + luci: routing/telephony/video are omitted to keep CI lean.
# A feed being listed does not bloat a build; only packages selected by the
# seed get built. Pin with ^<commit> here if you need bit-for-bit reproducibility.
src-git packages https://git.openwrt.org/feed/packages.git
src-git luci https://git.openwrt.org/project/luci.git
